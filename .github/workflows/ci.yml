name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Validate example configs
        run: |
          thalamus check examples/thalamus.yaml
          thalamus check examples/demo.yaml
      - name: Route a request end to end (no keys)
        run: thalamus ask examples/demo.yaml chat_reply "hello from CI"
