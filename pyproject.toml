[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thalamus-llm"
version = "0.1.0"
description = "Thalamus: policy-driven LLM routing. Map each task to a provider and model in YAML, with fallback chains, circuit breakers and built-in OpenAI-compatible and Anthropic providers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suryajiraje Bhosale" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["llm", "routing", "llmops", "circuit-breaker", "fallback", "model-routing", "openai", "anthropic", "gateway"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.40", "python-dotenv>=1.0"]
anthropic = ["anthropic>=0.40", "python-dotenv>=1.0"]
all = ["openai>=1.40", "anthropic>=0.40", "python-dotenv>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
thalamus = "thalamus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
